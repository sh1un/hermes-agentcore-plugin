[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-agentcore-plugin"
version = "0.2.0"
description = "Native Slack authorization and per-user AgentCore credentials for Hermes"
requires-python = ">=3.11"
dependencies = ["boto3==1.43.115", "mcp==2.3.0", "slack-bolt==1.30.0", "aiohttp==3.14.5", "PyJWT[crypto]==2.15.1", "httpx==0.28.1", "httpx2==2.15.1"]

[tool.setuptools.packages.find]
include = ["agentcore_core*"]
