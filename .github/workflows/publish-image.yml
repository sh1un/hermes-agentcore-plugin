name: Publish Hermes AgentCore image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test plugin
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests -v
      - name: Prepare immutable source
        run: |
          mkdir -p .ci/hermes-plugin/plugin
          git archive HEAD | tar -x -C .ci/hermes-plugin/plugin
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .ci/hermes-plugin
          platforms: linux/amd64
          push: true
          tags: ghcr.io/sh1un/hermes-agentcore-plugin:${{ github.sha }}
          build-args: |
            HERMES_BASE_IMAGE=nousresearch/hermes-agent@sha256:64923faeae267792bf9bf87fe3b4c4869e35004e360c7df01730ad801b74d524
            PLUGIN_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/sh1un/hermes-agentcore-plugin
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Published image: ghcr.io/sh1un/hermes-agentcore-plugin@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
